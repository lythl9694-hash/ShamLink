<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي | شام لينك</title>
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      .profile-card{max-width:620px;margin:auto;text-align:center}.profile-photo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #dff5ed;background:#edf5f2;margin:5px auto 16px;display:grid;place-items:center;font-size:54px}.profile-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover}.profile-data{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:right;margin:18px 0}.profile-field{padding:12px;border-radius:10px;background:#f8fafc}.profile-field span{display:block;color:#64748b;font-size:13px;margin-bottom:5px}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#b91c1c}.crop-modal{position:fixed;inset:0;z-index:10010;background:#000b;display:grid;place-items:center;padding:15px}.crop-modal[hidden]{display:none}.crop-card{width:min(390px,100%);background:#fff;padding:18px;border-radius:16px;text-align:center}.crop-frame{width:min(300px,80vw);height:min(300px,80vw);margin:12px auto;border-radius:50%;overflow:hidden;border:4px solid #07865f;background:#111;touch-action:none}.crop-frame canvas{width:100%;height:100%;display:block}.crop-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.crop-card input[type=range]{width:100%}@media(max-width:520px){.profile-data,.profile-actions{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header><div class="header-inner"><div><h1>الملف الشخصي</h1><p>حسابك في شام لينك</p></div><a class="home-link" href="index.html">الرئيسية</a></div></header>
    <main class="container">
      <section class="panel profile-card">
        <div class="profile-photo" id="profilePhoto">👤</div>
        <h2 id="profileName">جاري التحميل…</h2>
        <div class="profile-data" id="profileData"></div>
        <form id="profileForm">
          <label for="photoInput">الصورة الشخصية</label>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
          <label for="profileBio">نبذة قصيرة (اختياري)</label>
          <textarea id="profileBio" maxlength="300" placeholder="اكتب نبذة قصيرة عنك"></textarea>
          <div class="profile-actions"><button type="submit">حفظ الملف الشخصي</button><button class="danger" id="removePhoto" type="button">حذف الصورة</button></div>
        </form>
        <div class="notice" id="profileNotice" hidden></div>
      </section>
    </main>
    <div class="crop-modal" id="cropModal" hidden>
      <div class="crop-card">
        <h2>اقتصاص الصورة</h2>
        <p>حرّك الصورة بإصبعك وكبّرها حتى تصبح مناسبة.</p>
        <div class="crop-frame"><canvas id="cropCanvas" width="300" height="300"></canvas></div>
        <label for="cropZoom">تكبير الصورة</label><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" />
        <div class="crop-actions"><button type="button" id="applyCrop">اعتماد القص</button><button type="button" class="danger" id="cancelCrop">إلغاء</button></div>
      </div>
    </div>
    <script src="profile.js?v=20260904-1"></script>
    <script src="announcements.js?v=20260904-1"></script>
    <script src="support.js?v=20260904-1"></script>
  </body>
</html>
