<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الوكيل | شام لينك</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body data-mode="agent">
    <header>
      <div class="header-inner">
        <div>
          <h1>لوحة الوكيل</h1>
          <p id="activeAgency">اختر الوكالة لعرض بياناتها</p>
        </div>
        <a class="home-link" href="index.html">الرئيسية</a>
      </div>
    </header>
    <main class="container">
      <div class="notice">
        حاليًا يتم اختيار الوكالة بمعرّفها. عند إضافة تسجيل الدخول ستفتح لوحة كل
        وكيل تلقائيًا ولن يرى غير بيانات وكالته.
      </div>
      <section class="panel">
        <h2>اختيار الوكالة</h2>
        <div class="agency-picker"><select id="agencyPicker"></select></div>
      </section>
      <section class="stats" id="stats"></section>
      <section class="panel">
        <h2>موظفو الوكالة</h2>
        <input
          id="employeeSearch"
          type="search"
          placeholder="ابحث باسم الموظف أو EMP-ID أو رقم الجوال"
        />
        <div
          class="employee-list"
          id="employeeList"
          style="margin-top: 16px"
        ></div>
      </section>
      <section class="panel employee-detail" id="employeeDetail"></section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
