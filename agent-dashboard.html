<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الوكيل | شام لينك</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body data-mode="agent">
    <header>
      <div class="header-inner">
        <div>
          <h1>لوحة الوكيل</h1>
          <p id="activeAgency">اختر الوكالة لعرض بياناتها</p>
        </div>
        <div><a class="home-link" href="settlements.html">السقوف والتسويات</a> <a class="home-link" href="contracts.html">العقود</a> <a class="home-link" href="profile.html">ملفي الشخصي</a> <button class="home-link" id="logoutButton" type="button">تسجيل الخروج</button></div>
      </div>
    </header>
    <main class="container">
      <section class="panel" id="agencyProfile"></section>
      <section class="stats" id="stats"></section>
      <section class="panel">
        <h2>رصيد السيولة</h2>
        <p class="meta">أرصدة الوكالة الداخلية وحركات التحويل بين الوكالات.</p>
        <div id="liquidityBalances" class="balance-grid"></div>
        <div id="liquidityLedger" class="ledger-list"></div>
      </section>
      <section class="panel agent-only">
        <h2>دعوة موظف جديد</h2>
        <p class="meta">
          أنشئ رابط دعوة وأرسله للموظف. تنتهي صلاحيته بعد 72 ساعة ويُستخدم مرة
          واحدة.
        </p>
        <button type="button" id="createInvite">إنشاء رابط دعوة</button>
        <div id="inviteResult" class="notice" hidden></div>
      </section>
      <section class="panel agent-only">
        <h2>طلبات الموظفين</h2>
        <div class="employee-list" id="pendingEmployees"></div>
      </section>
      <section class="panel">
        <h2>موظفو الوكالة</h2>
        <input
          id="employeeSearch"
          type="search"
          placeholder="ابحث باسم الموظف أو EMP-ID أو رقم الجوال"
        />
        <div
          class="employee-list"
          id="employeeList"
          style="margin-top: 16px"
        ></div>
      </section>
      <section class="panel employee-detail" id="employeeDetail"></section>
    </main>
    <script src="dashboard.js?v=20260904-2"></script>
    <script src="admin-accounts.js?v=20260904-3"></script>
    <script src="announcements.js?v=20260904-2"></script>
    <script src="support.js?v=20260904-1"></script>
  </body>
</html>
