<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سقوف وتسويات الوكالات | شام لينك</title><link rel="stylesheet" href="dashboard.css"><style>textarea{width:100%;min-height:90px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:1/-1}.limit-card{border:1px solid #dbe7e2;border-radius:12px;padding:14px;margin-top:10px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.numbers div{background:#f5faf8;border-radius:9px;padding:10px;text-align:center}.proof{max-width:180px;max-height:150px;object-fit:contain;border-radius:8px}@media(max-width:650px){.form-grid,.numbers{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><header><div class="header-inner"><div><h1>سقوف وتسويات الوكالات</h1><p>منع تجاوز المديونية وتوثيق استلام الأموال</p></div><a class="home-link" href="index.html">الرئيسية</a></div></header><main class="container">
<section class="panel" id="agentControls" hidden><h2>تحديد سقف لوكالة</h2><p class="meta">السقف مستقل لكل وكالة ولكل عملة، وتُحتسب الحوالة فور إنشائها.</p><form id="limitForm" class="form-grid"><div><label>معرّف الوكالة</label><input id="limitAgency" placeholder="AG-000000" required></div><div><label>العملة</label><select id="limitCurrency"><option>USD</option><option>EUR</option><option>TRY</option><option>SYP</option></select></div><div><label>السقف</label><input id="limitAmount" type="number" min="0.01" step="0.01" required></div><button class="wide">حفظ السقف</button></form></section>
<section class="panel" id="settlementControls" hidden><h2>تم استلام أموالي</h2><p class="meta">أرفق وصل البنك أو شام كاش. يحاول النظام قراءة المبلغ والعملة، ويجب عليك مراجعتهما قبل التأكيد.</p><form id="settlementForm" class="form-grid"><div><label>الوكالة التي دفعت</label><input id="settlementAgency" placeholder="AG-000000" required></div><div><label>العملة</label><select id="settlementCurrency"><option>USD</option><option>EUR</option><option>TRY</option><option>SYP</option></select></div><div><label>المبلغ المستلم</label><input id="settlementAmount" type="number" min="0.01" step="0.01" required></div><div class="wide"><label>إثبات التسليم</label><input id="settlementProof" type="file" accept="image/jpeg,image/png,image/webp" required></div><button type="button" id="readProof">قراءة الإثبات</button><button type="submit">تأكيد وخصم التسوية</button></form><div class="notice" id="ocrNotice" hidden></div></section>
<section class="panel"><h2>السقوف الحالية</h2><div id="limitList"></div></section><section class="panel"><h2>سجل التسويات</h2><div id="settlementList"></div></section>
</main><script src="settlements.js?v=20260904-1"></script><script src="announcements.js?v=20260904-1"></script><script src="support.js?v=20260904-1"></script></body></html>
