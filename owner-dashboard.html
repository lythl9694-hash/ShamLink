<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة صاحب المنصة | شام لينك</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body data-mode="owner">
    <header>
      <div class="header-inner">
        <div>
          <h1>لوحة صاحب المنصة</h1>
          <p>الوكالات والموظفون وسجلات الحوالات</p>
        </div>
        <button class="home-link" id="logoutButton" type="button">
          تسجيل الخروج
        </button>
      </div>
    </header>
    <main class="container">
      <section class="stats" id="stats"></section>
      <section class="panel">
        <h2>طلبات الوكلاء</h2>
        <p class="meta">
          راجع الطلب، أدخل اسم الوكالة، ثم وافق ليحصل الحساب على صلاحيات الوكيل.
        </p>
        <div class="employee-list" id="pendingAgents"></div>
      </section>
      <section class="panel" id="agenciesSection">
        <h2>الوكالات</h2>
        <div class="agency-list" id="agencyList"></div>
      </section>
      <section class="panel">
        <h2>إدارة سيولة الوكالات</h2>
        <p class="meta">أضف أو اخصم رصيداً محاسبياً باستخدام معرّف الوكالة. تُسجّل كل حركة ولا يمكن حذفها.</p>
        <form id="liquidityForm" class="liquidity-form">
          <div><label for="liquidityAgencyId">معرّف الوكالة</label><input id="liquidityAgencyId" placeholder="AG-000000" required /></div>
          <div><label for="liquidityCurrency">العملة</label><select id="liquidityCurrency" required><option>USD</option><option>EUR</option><option>TRY</option><option>SYP</option></select></div>
          <div><label for="liquidityAmount">المبلغ</label><input id="liquidityAmount" type="number" min="0.01" step="0.01" required /></div>
          <div><label for="liquidityDirection">نوع الحركة</label><select id="liquidityDirection"><option value="add">إضافة رصيد</option><option value="subtract">خصم رصيد</option></select></div>
          <div class="wide"><label for="liquidityReason">السبب أو رقم المرجع</label><input id="liquidityReason" required /></div>
          <button type="submit">تنفيذ الحركة</button>
        </form>
        <div id="liquidityNotice" class="notice" hidden></div>
        <div id="liquidityBalances" class="balance-grid"></div>
        <div id="liquidityLedger" class="ledger-list"></div>
      </section>
      <section class="panel">
        <h2>البحث عن موظف</h2>
        <input
          id="employeeSearch"
          type="search"
          placeholder="اكتب اسم الموظف أو EMP-ID أو رقم الجوال"
        />
        <div
          class="employee-list"
          id="employeeList"
          style="margin-top: 16px"
        ></div>
      </section>
      <section class="panel employee-detail" id="employeeDetail"></section>
    </main>
    <script src="dashboard.js?v=20260904-3"></script>
    <script src="admin-accounts.js?v=20260904-3"></script>
  </body>
</html>
