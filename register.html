<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | شام لينك</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>إنشاء حساب</h1>
          <p>يُفعّل الحساب بعد موافقة الجهة المسؤولة</p>
        </div>
        <a class="home-link" href="login.html">تسجيل الدخول</a>
      </div>
    </header>
    <main class="container" style="max-width: 620px">
      <section class="panel">
        <form id="registerForm">
          <label for="registerName">الاسم الكامل</label>
          <input id="registerName" name="name" required autocomplete="name" />
          <label for="registerPhone">رقم الجوال</label>
          <input
            id="registerPhone"
            name="phone"
            type="tel"
            required
            autocomplete="tel"
          />
          <label for="registerPassword">كلمة المرور</label>
          <input
            id="registerPassword"
            name="password"
            type="password"
            minlength="8"
            required
            autocomplete="new-password"
          />
          <div id="accountTypeBox">
            <label for="accountType">نوع الحساب المطلوب</label>
            <select id="accountType" name="accountType">
              <option value="client">مستخدم</option>
              <option value="agent">طلب حساب وكيل</option>
            </select>
          </div>
          <div id="inviteBox">
            <label for="inviteCode"
              >كود دعوة الموظف <span class="meta">(إن وجد)</span></label
            >
            <input id="inviteCode" name="inviteCode" autocomplete="off" />
          </div>
          <button type="submit" style="width: 100%; margin-top: 18px">
            إنشاء الحساب
          </button>
        </form>
        <p id="registerMessage" class="meta"></p>
      </section>
    </main>
    <script src="account.js"></script>
    <script src="support.js?v=20260904-1"></script>
  </body>
</html>
