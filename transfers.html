<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الحوالات | شام لينك</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7f6;
        color: #222;
      }

      header {
        background: #07875f;
        color: white;
        text-align: center;
        padding: 25px 15px;
      }

      header h1 {
        margin: 0 0 8px;
      }

      header p {
        margin: 0;
      }

      .container {
        max-width: 750px;
        margin: auto;
        padding: 20px;
      }

      .back {
        display: inline-block;
        margin-bottom: 15px;
        color: #07875f;
        text-decoration: none;
        font-weight: bold;
      }

      .card {
        background: white;
        padding: 22px;
        border-radius: 14px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
      }

      h2 {
        color: #07875f;
        margin-top: 0;
      }

      label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
      }

      .optional {
        color: #777;
        font-size: 13px;
        font-weight: normal;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: white;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #07875f;
        color: white;
        font-size: 17px;
        cursor: pointer;
      }

      .notice {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        background: #e7f7f1;
        color: #056747;
        text-align: center;
        line-height: 1.8;
      }

      .commission-box {
        margin-top: 14px;
        padding: 14px;
        border: 1px solid #b8e4d4;
        border-radius: 8px;
        background: #f0fbf7;
        line-height: 1.9;
      }

      .sms-message {
        margin-top: 12px;
        padding: 12px;
        background: white;
        border-radius: 8px;
        color: #333;
      }

      .search-box {
        margin-bottom: 20px;
      }

      .search-box input {
        border: 2px solid #07875f;
      }

      .transfer-item {
        padding: 15px 0;
        border-bottom: 1px solid #ddd;
        line-height: 1.9;
      }

      .transfer-number {
        color: #07875f;
        font-weight: bold;
      }

      .sms-code {
        color: #2563eb;
        font-weight: bold;
      }

      .status {
        color: #b45309;
        font-weight: bold;
      }

      .status.delivered {
        color: #07875f;
      }

      .delivery-button {
        margin-top: 14px;
        background: #2563eb;
      }

      .delivery-form {
        display: none;
        margin-top: 14px;
        padding: 15px;
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        background: #eff6ff;
      }

      .delivery-form label:first-child {
        margin-top: 0;
      }

      .delivery-error {
        display: none;
        margin-top: 10px;
        color: #b91c1c;
        font-weight: bold;
      }

      .delivery-details {
        margin-top: 10px;
        padding: 12px;
        border-radius: 8px;
        background: #e7f7f1;
        color: #056747;
      }

      .receipt-card {
        margin-top: 16px;
        padding: 18px;
        border: 1px solid #b8e4d4;
        border-radius: 12px;
        background: white;
        text-align: right;
      }

      .receipt-card h3 {
        margin: 0 0 12px;
        color: #07875f;
        text-align: center;
      }

      .receipt-button {
        margin-top: 12px;
        background: #374151;
      }

      .code-warning {
        margin-top: 10px;
        color: #b45309;
        font-weight: bold;
      }

      .owner-code-panel {
        margin-top: 14px;
        padding: 15px;
        border: 2px solid #07875f;
        border-radius: 10px;
        background: #f0fdf8;
      }

      .owner-code-panel h4 {
        margin: 0 0 8px;
        color: #056747;
      }

      .owner-secret-code {
        display: inline-block;
        margin: 5px 0 10px;
        padding: 7px 14px;
        border-radius: 8px;
        background: #ffffff;
        color: #1d4ed8;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 3px;
      }

      .send-code-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .send-code-actions button {
        margin-top: 0;
      }

      .whatsapp-button {
        background: #16a34a;
      }

      @media (max-width: 520px) {
        .send-code-actions {
          grid-template-columns: 1fr;
        }
      }

      .empty {
        color: #777;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>الحوالات</h1>
      <p>شام لينك</p>
    </header>

    <div class="container">
      <a class="back" href="index.html"> ← العودة للرئيسية </a>

      <div class="card">
        <h2>إنشاء حوالة جديدة</h2>

        <form id="transferForm">
          <label for="sender">
            اسم المرسل
            <span class="optional">(اختياري)</span>
          </label>
          <input id="sender" type="text" placeholder="الاسم الكامل - اختياري" />

          <label for="receiver">اسم المستلم</label>
          <input
            id="receiver"
            type="text"
            placeholder="الاسم الكامل"
            required
          />

          <label for="phone">رقم هاتف المستلم</label>
          <input id="phone" type="tel" placeholder="+963..." required />

          <label for="amount">مبلغ الحوالة</label>
          <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="أدخل المبلغ"
            required
          />

          <label for="currency">العملة</label>
          <select id="currency" required>
            <option value="">اختر العملة</option>
            <option value="USD">دولار أمريكي USD</option>
            <option value="SYP">ليرة سورية SYP</option>
            <option value="TRY">ليرة تركية TRY</option>
            <option value="EUR">يورو EUR</option>
          </select>

          <div class="commission-box" id="commissionPreview">
            اختر المبلغ والعملة لعرض العمولة تلقائياً.
          </div>

          <label for="source">مصدر الحوالة</label>
          <input id="source" type="text" placeholder="الوكالة أو المدينة" />

          <label for="destination">الوجهة / وكالة التسليم</label>
          <input
            id="destination"
            type="text"
            placeholder="المدينة أو الوكالة المستلمة"
          />

          <label for="deliveryAddress">
            عنوان التسليم
            <span class="optional">(اختياري)</span>
          </label>
          <input
            id="deliveryAddress"
            type="text"
            placeholder="عنوان وكالة أو نقطة التسليم"
          />

          <label for="notes">
            ملاحظات
            <span class="optional">(اختياري)</span>
          </label>
          <textarea id="notes" placeholder="أي ملاحظات إضافية"></textarea>

          <button type="submit">إنشاء الحوالة</button>
        </form>

        <div class="notice" id="notice"></div>
      </div>

      <div class="card">
        <h2>📋 سجل الحوالات</h2>

        <div class="search-box">
          <label for="search">🔎 البحث في السجل</label>
          <input
            id="search"
            type="text"
            placeholder="الاسم، رقم الجوال أو رقم الحوالة"
          />
        </div>

        <div id="transfersList">
          <p class="empty">لا توجد حوالات مسجلة بعد.</p>
        </div>
      </div>
    </div>
    <script>
      const form = document.getElementById("transferForm");
      const notice = document.getElementById("notice");
      const transfersList = document.getElementById("transfersList");
      const searchInput = document.getElementById("search");
      const amountInput = document.getElementById("amount");
      const currencyInput = document.getElementById("currency");
      const commissionPreview = document.getElementById("commissionPreview");

      const defaultCommissionRates = { USD: 0, SYP: 0, TRY: 0, EUR: 0 };

      function getSmsValidityHours() {
        return Math.max(
          1,
          Number(localStorage.getItem("shamlink_sms_validity_hours") || 24),
        );
      }

      function getCommissionRates() {
        return {
          ...defaultCommissionRates,
          ...(JSON.parse(localStorage.getItem("shamlink_commission_rates")) ||
            {}),
        };
      }

      function calculateCommission(amount, currency) {
        const rate = Number(getCommissionRates()[currency] || 0);
        const commission = (Number(amount || 0) * rate) / 100;
        return { rate, commission, total: Number(amount || 0) + commission };
      }

      function updateCommissionPreview() {
        const amount = Number(amountInput.value || 0);
        const currency = currencyInput.value;

        if (!amount || !currency) {
          commissionPreview.textContent =
            "اختر المبلغ والعملة لعرض العمولة تلقائياً.";
          return;
        }

        const result = calculateCommission(amount, currency);
        commissionPreview.innerHTML =
          "نسبة العمولة: <strong>" +
          result.rate +
          "%</strong><br>قيمة العمولة: <strong>" +
          result.commission.toFixed(2) +
          " " +
          currency +
          "</strong><br>الإجمالي المطلوب: <strong>" +
          result.total.toFixed(2) +
          " " +
          currency +
          "</strong>";
      }

      let transfers =
        JSON.parse(localStorage.getItem("shamlink_transfers")) || [];

      let migratedSmsData = false;
      transfers.forEach(function (transfer) {
        if (transfer.codeSentAt && !transfer.smsExpiresAt) {
          transfer.smsExpiresAt =
            Date.now() + getSmsValidityHours() * 60 * 60 * 1000;
          migratedSmsData = true;
        }
        if (typeof transfer.smsAttempts !== "number") {
          transfer.smsAttempts = 0;
          migratedSmsData = true;
        }
      });

      function saveTransfers() {
        localStorage.setItem("shamlink_transfers", JSON.stringify(transfers));
      }

      if (migratedSmsData) saveTransfers();

      function isSmsExpired(transfer) {
        return (
          Boolean(transfer.codeSentAt) &&
          Date.now() > Number(transfer.smsExpiresAt || 0)
        );
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderTransfers(searchText = "") {
        const text = searchText.trim().toLowerCase();

        const filteredTransfers = transfers.filter(function (transfer) {
          const searchableText = [
            transfer.sender,
            transfer.receiver,
            transfer.phone,
            transfer.code,
          ]
            .join(" ")
            .toLowerCase();

          return searchableText.includes(text);
        });

        if (filteredTransfers.length === 0) {
          transfersList.innerHTML =
            '<p class="empty">لا توجد حوالات مطابقة للبحث.</p>';
          return;
        }

        transfersList.innerHTML = "";

        filteredTransfers
          .slice()
          .reverse()
          .forEach(function (transfer) {
            const item = document.createElement("div");
            item.className = "transfer-item";

            const senderName = transfer.sender ? transfer.sender : "غير مذكور";
            const isDelivered = transfer.status === "تم التسليم";
            const codeWasSent = Boolean(transfer.codeSentAt);
            const codeExpired = !isDelivered && isSmsExpired(transfer);
            const codeLocked =
              !isDelivered &&
              (transfer.smsLocked || Number(transfer.smsAttempts || 0) >= 3);

            item.innerHTML =
              '<span class="transfer-number">رقم الحوالة: ' +
              escapeHtml(transfer.code) +
              "</span><br>" +
              "اسم المرسل: " +
              escapeHtml(senderName) +
              "<br>" +
              "اسم المستلم: " +
              escapeHtml(transfer.receiver) +
              "<br>" +
              "رقم الجوال: " +
              escapeHtml(transfer.phone) +
              "<br>" +
              "المبلغ: " +
              transfer.amount +
              " " +
              transfer.currency +
              "<br>" +
              "العمولة: " +
              Number(transfer.commission || 0).toFixed(2) +
              " " +
              transfer.currency +
              " (" +
              Number(transfer.commissionRate || 0) +
              "%)<br>" +
              "الإجمالي: " +
              Number(transfer.total || transfer.amount).toFixed(2) +
              " " +
              transfer.currency +
              "<br>" +
              "المصدر: " +
              escapeHtml(transfer.source) +
              "<br>" +
              "الوجهة: " +
              escapeHtml(transfer.destination || "غير محددة") +
              "<br>" +
              '<span class="status ' +
              (isDelivered ? "delivered" : "") +
              '">الحالة: ' +
              (transfer.status || "قيد الانتظار") +
              "</span><br>" +
              "<small>" +
              escapeHtml(transfer.date) +
              "</small>" +
              (!isDelivered
                ? '<div class="owner-code-panel"><h4>📨 إرسال الكود للمستلم</h4>' +
                  (codeWasSent
                    ? "<div>آخر إرسال: " +
                      escapeHtml(
                        transfer.codeChannel === "whatsapp" ? "واتساب" : "SMS",
                      ) +
                      " — صالح حتى " +
                      escapeHtml(
                        new Date(transfer.smsExpiresAt).toLocaleString("ar"),
                      ) +
                      "</div>"
                    : "<div>أدخل رقم المستلم المسجل بالحوالة، ثم اختر طريقة الإرسال.</div>") +
                  '<form class="send-code-form" data-code="' +
                  escapeHtml(transfer.code) +
                  '" autocomplete="off"><label>رقم هاتف المستلم</label><input name="recipientPhone" type="tel" autocomplete="off" required placeholder="أدخل الرقم للتأكد"><label>طريقة الإرسال</label><select name="channel" required><option value="sms">رسالة SMS</option><option value="whatsapp">واتساب</option></select><button type="submit">إرسال كود الاستلام</button><div class="delivery-error"></div></form></div>'
                : "") +
              (isDelivered
                ? '<div class="delivery-details">✅ سلّمها الموظف: <strong>' +
                  escapeHtml(transfer.deliveredBy) +
                  "</strong><br>رقم الموظف: " +
                  escapeHtml(transfer.employeeId) +
                  "<br>رقم هوية المستلم: " +
                  escapeHtml(transfer.recipientId) +
                  "<br>وقت التسليم: " +
                  escapeHtml(transfer.deliveredAt) +
                  "</div>"
                : !codeWasSent
                  ? '<div class="code-warning">بانتظار إرسال كود الاستلام للمستلم</div>'
                  : codeExpired
                    ? '<div class="code-warning">انتهت صلاحية كود الاستلام</div>'
                    : codeLocked
                      ? '<div class="code-warning">تم إيقاف التحقق بعد 3 محاولات خاطئة</div>'
                      : '<button class="delivery-button" type="button" data-action="open-delivery" data-code="' +
                        escapeHtml(transfer.code) +
                        '">تسليم الحوالة</button>' +
                        '<form class="delivery-form" data-code="' +
                        escapeHtml(transfer.code) +
                        '" autocomplete="off"><label>كود SMS الذي قدّمه المستلم</label><input name="smsCode" inputmode="numeric" maxlength="4" autocomplete="off" required placeholder="أدخل الكود المكوّن من 4 أرقام"><label>اسم الموظف الذي سلّم الحوالة</label><input name="employeeName" autocomplete="off" required placeholder="الاسم الكامل"><label>رقم الموظف</label><input name="employeeId" autocomplete="off" required placeholder="مثال: EMP-001"><label>رقم هوية المستلم</label><input name="recipientId" autocomplete="off" required placeholder="هوية، إقامة أو جواز سفر"><button type="submit">تأكيد التسليم</button><div class="delivery-error"></div></form>') +
              '<button class="receipt-button" type="button" data-action="download-receipt" data-code="' +
              escapeHtml(transfer.code) +
              '">تنزيل الإشعار كصورة</button>';

            transfersList.appendChild(item);
          });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const sender = document.getElementById("sender").value.trim();

        const receiver = document.getElementById("receiver").value.trim();

        const phone = document.getElementById("phone").value.trim();

        const amount = document.getElementById("amount").value;

        const currency = document.getElementById("currency").value;

        const commissionResult = calculateCommission(amount, currency);

        const source =
          document.getElementById("source").value.trim() || "غير محدد";

        const destination =
          document.getElementById("destination").value.trim() || "غير محددة";

        const deliveryAddress = document
          .getElementById("deliveryAddress")
          .value.trim();

        const notes = document.getElementById("notes").value.trim();

        const transferCode = Math.floor(100000 + Math.random() * 900000);

        const smsCode = Math.floor(1000 + Math.random() * 9000);

        const transfer = {
          code: transferCode,
          smsCode: smsCode,
          sender: sender,
          receiver: receiver,
          phone: phone,
          amount: amount,
          currency: currency,
          commissionRate: commissionResult.rate,
          commission: commissionResult.commission,
          total: commissionResult.total,
          source: source,
          destination: destination,
          deliveryAddress: deliveryAddress,
          notes: notes,
          status: "قيد الانتظار",
          date: new Date().toLocaleString("ar"),
          codeSentAt: null,
          codeChannel: null,
          smsExpiresAt: null,
          smsAttempts: 0,
          smsLocked: false,
        };

        transfers.push(transfer);
        saveTransfers();

        notice.style.display = "block";

        notice.innerHTML =
          '<div class="receipt-card"><h3>إشعار حوالة | شام لينك</h3>' +
          "تم إنشاء الحوالة بنجاح ✅<br>" +
          "رقم الحوالة: <strong>" +
          transferCode +
          "</strong><br>المستلم: " +
          escapeHtml(receiver) +
          "<br>المبلغ: " +
          Number(amount).toFixed(2) +
          " " +
          currency +
          "<br>العمولة: " +
          commissionResult.commission.toFixed(2) +
          " " +
          currency +
          "<br>الإجمالي: <strong>" +
          commissionResult.total.toFixed(2) +
          " " +
          currency +
          "</strong><br>التاريخ: " +
          escapeHtml(transfer.date) +
          "</div>" +
          '<div class="sms-message">📱 كود الاستلام سري ولا يظهر في الإشعار. تبدأ مدة صلاحيته عند إرساله للمستلم، ومدتها ' +
          getSmsValidityHours() +
          " ساعة، ويسمح بثلاث محاولات فقط.</div>" +
          '<button class="receipt-button" type="button" data-action="download-receipt" data-code="' +
          transferCode +
          '">تنزيل الإشعار كصورة</button>';

        form.reset();
        updateCommissionPreview();
        searchInput.value = "";
        renderTransfers();
      });

      searchInput.addEventListener("input", function () {
        renderTransfers(searchInput.value);
      });

      document.addEventListener("click", function (event) {
        const receiptButton = event.target.closest(
          '[data-action="download-receipt"]',
        );
        if (receiptButton) {
          downloadReceipt(receiptButton.dataset.code);
          return;
        }

        const button = event.target.closest('[data-action="open-delivery"]');
        if (!button) return;

        const deliveryForm = transfersList.querySelector(
          '.delivery-form[data-code="' + button.dataset.code + '"]',
        );
        deliveryForm.style.display =
          deliveryForm.style.display === "block" ? "none" : "block";
      });

      transfersList.addEventListener("submit", function (event) {
        const sendCodeForm = event.target.closest(".send-code-form");
        if (sendCodeForm) {
          event.preventDefault();
          const transfer = transfers.find(
            (item) => String(item.code) === sendCodeForm.dataset.code,
          );
          if (!transfer) return;

          const enteredPhone = sendCodeForm.elements.recipientPhone.value
            .replace(/\D/g, "")
            .replace(/^00/, "");
          const savedPhone = String(transfer.phone)
            .replace(/\D/g, "")
            .replace(/^00/, "");
          const error = sendCodeForm.querySelector(".delivery-error");

          if (!enteredPhone || enteredPhone !== savedPhone) {
            error.textContent = "رقم الهاتف لا يطابق الرقم المسجل بالحوالة.";
            error.style.display = "block";
            return;
          }

          sendPickupCode(transfer.code, sendCodeForm.elements.channel.value);
          return;
        }

        const deliveryForm = event.target.closest(".delivery-form");
        if (!deliveryForm) return;
        event.preventDefault();

        const transfer = transfers.find(
          (item) => String(item.code) === deliveryForm.dataset.code,
        );
        const enteredCode = deliveryForm.elements.smsCode.value.trim();

        if (!transfer) return;

        if (isSmsExpired(transfer)) {
          renderTransfers(searchInput.value);
          return;
        }

        if (enteredCode !== String(transfer.smsCode)) {
          transfer.smsAttempts = Number(transfer.smsAttempts || 0) + 1;
          const remainingAttempts = Math.max(0, 3 - transfer.smsAttempts);
          transfer.auditLog = transfer.auditLog || [];
          transfer.auditLog.push({
            action: "محاولة تسليم فاشلة",
            date: new Date().toLocaleString("ar"),
          });

          if (remainingAttempts === 0) {
            transfer.smsLocked = true;
            saveTransfers();
            renderTransfers(searchInput.value);
            return;
          }

          saveTransfers();
          const error = deliveryForm.querySelector(".delivery-error");
          error.textContent =
            "كود غير صحيح. المحاولات المتبقية: " + remainingAttempts;
          error.style.display = "block";
          return;
        }

        transfer.status = "تم التسليم";
        transfer.deliveredBy = deliveryForm.elements.employeeName.value.trim();
        transfer.employeeId = deliveryForm.elements.employeeId.value.trim();
        transfer.recipientId = deliveryForm.elements.recipientId.value.trim();
        transfer.deliveredAt = new Date().toLocaleString("ar");
        transfer.smsAttempts = 0;
        transfer.auditLog = transfer.auditLog || [];
        transfer.auditLog.push({
          action: "تسليم الحوالة",
          employeeName: transfer.deliveredBy,
          employeeId: transfer.employeeId,
          recipientId: transfer.recipientId,
          date: transfer.deliveredAt,
        });

        saveTransfers();
        renderTransfers(searchInput.value);
      });

      function sendPickupCode(transferCode, channel) {
        const transfer = transfers.find(
          (item) => String(item.code) === String(transferCode),
        );
        if (!transfer || transfer.status === "تم التسليم") return;

        transfer.smsCode = Math.floor(1000 + Math.random() * 9000);
        transfer.codeSentAt = Date.now();
        transfer.codeChannel = channel;
        transfer.smsExpiresAt =
          Date.now() + getSmsValidityHours() * 60 * 60 * 1000;
        transfer.smsAttempts = 0;
        transfer.smsLocked = false;
        transfer.auditLog = transfer.auditLog || [];
        transfer.auditLog.push({
          action:
            channel === "whatsapp"
              ? "إرسال كود الاستلام عبر واتساب"
              : "إرسال كود الاستلام عبر SMS",
          date: new Date().toLocaleString("ar"),
        });
        saveTransfers();

        const message =
          "شام لينك: كود استلام الحوالة رقم " +
          transfer.code +
          " هو " +
          transfer.smsCode +
          ". صالح لمدة " +
          getSmsValidityHours() +
          " ساعة. لا تشارك الكود مع أي شخص قبل استلام حوالتك.";

        renderTransfers(searchInput.value);

        if (channel === "whatsapp") {
          const whatsappPhone = String(transfer.phone).replace(/\D/g, "");
          window.location.href =
            "https://wa.me/" +
            whatsappPhone +
            "?text=" +
            encodeURIComponent(message);
          return;
        }

        window.location.href =
          "sms:" + transfer.phone + "?body=" + encodeURIComponent(message);
      }

      function downloadReceipt(transferCode) {
        const transfer = transfers.find(
          (item) => String(item.code) === String(transferCode),
        );
        if (!transfer) return;

        const canvas = document.createElement("canvas");
        canvas.width = 1600;
        canvas.height = 1100;
        const context = canvas.getContext("2d");

        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = "#07875f";
        context.fillRect(0, 0, canvas.width, 18);

        context.globalAlpha = 0.035;
        context.fillStyle = "#07875f";
        for (let x = 70; x < 1550; x += 42) {
          for (let y = 70; y < 1030; y += 42) {
            context.beginPath();
            context.arc(x, y, 5, 0, Math.PI * 2);
            context.fill();
          }
        }
        context.globalAlpha = 1;

        context.direction = "rtl";
        context.textAlign = "right";

        context.strokeStyle = "#07875f";
        context.lineWidth = 12;
        context.beginPath();
        context.arc(1450, 105, 58, 0, Math.PI * 2);
        context.stroke();
        context.fillStyle = "#07875f";
        context.font = "bold 34px Arial";
        context.textAlign = "center";
        context.fillText("SL", 1450, 118);
        context.textAlign = "right";
        context.font = "bold 48px Arial";
        context.fillText("شام لينك", 1365, 95);
        context.fillStyle = "#64748b";
        context.font = "25px Arial";
        context.fillText("إشعار حوالة مالية", 1365, 138);

        context.fillStyle = "#111827";
        context.font = "30px Arial";
        context.fillText("رقم الإشعار", 565, 82);
        context.fillStyle = "#1d4ed8";
        context.font = "bold 38px Arial";
        context.fillText("SL-" + transfer.code, 565, 132);

        context.strokeStyle = "#d1d5db";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(60, 190);
        context.lineTo(1540, 190);
        context.stroke();

        function drawField(label, value, x, y, width) {
          context.fillStyle = "#64748b";
          context.font = "26px Arial";
          context.fillText(label, x + width, y);
          context.fillStyle = "#111827";
          context.font = "bold 31px Arial";
          context.fillText(String(value || "غير محدد"), x + width, y + 48);
        }

        function drawWrappedText(text, rightX, y, maxWidth, lineHeight) {
          const words = String(text || "غير محدد").split(" ");
          let line = "";
          let currentY = y;
          words.forEach(function (word) {
            const testLine = line ? line + " " + word : word;
            if (context.measureText(testLine).width > maxWidth && line) {
              context.fillText(line, rightX, currentY);
              line = word;
              currentY += lineHeight;
            } else {
              line = testLine;
            }
          });
          context.fillText(line, rightX, currentY);
        }

        drawField("المصدر", transfer.source, 1080, 245, 380);
        drawField("الوجهة", transfer.destination || "غير محددة", 590, 245, 380);
        drawField("التاريخ", transfer.date, 80, 245, 400);

        context.fillStyle = "#eef2f1";
        context.fillRect(45, 365, 1510, 310);
        drawField("المستفيد", transfer.receiver, 1080, 420, 390);
        drawField("رقم الجوال", transfer.phone, 590, 420, 380);
        drawField("المرسل", transfer.sender || "غير مذكور", 90, 420, 380);

        context.textAlign = "center";
        context.fillStyle = "#dc2626";
        context.font = "bold 50px Arial";
        context.fillText(
          Number(transfer.amount).toFixed(2) + " " + transfer.currency,
          800,
          585,
        );
        context.fillStyle = "#374151";
        context.font = "27px Arial";
        context.fillText(
          "العمولة " +
            Number(transfer.commission || 0).toFixed(2) +
            " — الإجمالي " +
            Number(transfer.total || transfer.amount).toFixed(2) +
            " " +
            transfer.currency,
          800,
          635,
        );

        context.textAlign = "right";
        context.fillStyle = "#111827";
        context.font = "bold 30px Arial";
        context.fillText("عنوان التسليم", 1480, 735);
        context.font = "28px Arial";
        context.fillStyle = "#374151";
        drawWrappedText(
          transfer.deliveryAddress || transfer.destination || "غير محدد",
          1480,
          785,
          1400,
          38,
        );

        context.strokeStyle = "#9ca3af";
        context.setLineDash([7, 7]);
        context.beginPath();
        context.moveTo(70, 835);
        context.lineTo(1530, 835);
        context.stroke();
        context.setLineDash([]);

        context.fillStyle = "#111827";
        context.font = "bold 30px Arial";
        context.fillText("ملاحظات هامة", 1480, 895);
        context.font = "27px Arial";
        context.fillStyle = "#374151";
        context.fillText(
          "• تُسلّم الحوالة بعد التأكد من الهوية الأصلية للمستفيد.",
          1480,
          945,
        );
        context.fillText(
          "• لا تشارك هذا الإشعار إلا مع الجهة المعنية بالحوالة.",
          1480,
          990,
        );
        context.fillStyle = "#07875f";
        context.font = "bold 25px Arial";
        context.textAlign = "left";
        context.fillText("SL-" + transfer.code, 80, 1040);
        context.textAlign = "right";
        context.fillStyle = "#64748b";
        context.font = "22px Arial";
        context.fillText(
          "كود الاستلام السري غير ظاهر في هذا الإشعار",
          1520,
          1040,
        );

        const link = document.createElement("a");
        link.download = "ShamLink-" + transfer.code + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      amountInput.addEventListener("input", updateCommissionPreview);
      currencyInput.addEventListener("change", updateCommissionPreview);

      renderTransfers();
    </script>
  </body>
</html>
